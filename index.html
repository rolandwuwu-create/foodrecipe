<!DOCTYPE html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>冰箱裡有什麼 · 20分鐘晚餐</title>
<meta name="description" content="勾選冰箱裡現有的食材，找出20分鐘內能上桌的家常菜。">
<meta name="theme-color" content="#191512">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🍳</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Oswald:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#191512; --ink2:#221D19; --ink3:#2F2822; --ink4:#3D342C;
  --paper:#F1E9DC; --dim:#A29585; --dimmer:#6E6357;
  --yolk:#F0B429; --scallion:#8FB05E; --chili:#C8412C;
  --serif:'Noto Serif TC','PingFang TC','Microsoft JhengHei',serif;
  --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --num:'Oswald','Noto Sans TC',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:15px;line-height:1.65;padding:0 0 64px}
.wrap{max-width:940px;margin:0 auto;padding:0 18px}
:focus-visible{outline:2px solid var(--yolk);outline-offset:3px;border-radius:2px}

header{padding:30px 0 4px}
.eyebrow{font-family:var(--num);font-size:12px;letter-spacing:.22em;color:var(--dimmer);text-transform:uppercase;margin-bottom:12px}
.eyebrow b{color:var(--dim);font-weight:400}
.htitle{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--serif);font-weight:900;font-size:29px;line-height:1.25;letter-spacing:.02em}
.tog{background:none;border:1px solid var(--ink3);color:var(--dim);border-radius:3px;padding:5px 13px;
  font-size:13px;cursor:pointer;font-family:var(--sans);transition:.14s}
.tog:hover{border-color:var(--ink4);color:var(--paper)}

.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
#q{background:var(--ink2);border:1px solid var(--ink3);color:var(--paper);border-radius:3px;
  padding:8px 13px;font-family:var(--sans);font-size:14px;width:190px}
#q::placeholder{color:var(--dimmer)}
.have-n{font-size:13px;color:var(--dim)}
.have-n b{font-family:var(--num);color:var(--yolk);font-size:15px}
.clear{background:none;border:0;color:var(--dimmer);font-size:13px;cursor:pointer;font-family:var(--sans);margin-left:auto}
.clear:hover{color:var(--chili)}

.gname{font-family:var(--num);font-size:11px;letter-spacing:.24em;color:var(--dimmer);margin:16px 0 8px}
.items{display:flex;gap:5px;flex-wrap:wrap}
.it{background:none;border:1px solid var(--ink3);color:var(--dim);border-radius:999px;
  padding:5px 12px;font-size:13px;font-family:var(--sans);cursor:pointer;transition:.14s}
.it:hover{border-color:var(--dimmer);color:var(--paper)}
.it[aria-pressed=true]{background:var(--paper);border-color:var(--paper);color:var(--ink);font-weight:500}
.it.sauce[aria-pressed=true]{background:var(--ink4);border-color:var(--ink4);color:var(--paper);font-weight:400}
.it.sauce[aria-pressed=false]{border-style:dashed;color:var(--dimmer);text-decoration:line-through}
details{margin-top:18px;border-top:1px solid var(--ink3);padding-top:13px}
summary{font-family:var(--num);font-size:11px;letter-spacing:.24em;color:var(--dimmer);cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ "}
details[open] summary::before{content:"▾ "}
summary:hover{color:var(--dim)}
.shelf-note{font-size:12.5px;color:var(--dimmer);margin:9px 0 11px;line-height:1.7}
.folded{font-size:13.5px;color:var(--dim);line-height:1.9;margin-top:14px}
.folded span{display:inline-block;background:var(--ink2);border:1px solid var(--ink3);border-radius:999px;padding:2px 10px;margin:0 4px 4px 0;font-size:12.5px}
.folded em{color:var(--dimmer);font-style:normal}

.bar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid var(--ink3)}
.bar+.bar{margin-top:9px;padding-top:0;border-top:0}
.lab{font-family:var(--num);font-size:11px;letter-spacing:.16em;color:var(--dimmer);margin-right:1px}
.mini{background:none;border:1px solid var(--ink3);color:var(--dim);border-radius:3px;padding:5px 10px;
  font-family:var(--num);font-size:13px;cursor:pointer;transition:.14s}
.mini:hover{border-color:var(--ink4);color:var(--paper)}
.mini[aria-pressed=true]{background:var(--paper);border-color:var(--paper);color:var(--ink)}
.pill{background:none;border:1px solid var(--ink3);color:var(--dim);border-radius:999px;padding:5px 12px;
  font-size:13px;cursor:pointer;font-family:var(--sans);transition:.14s}
.pill:hover{border-color:var(--dimmer);color:var(--paper)}
.pill[aria-pressed=true]{background:var(--paper);border-color:var(--paper);color:var(--ink)}
.pill.kid[aria-pressed=true]{background:var(--scallion);border-color:var(--scallion);color:#16200A}
.pill.fav[aria-pressed=true]{background:var(--yolk);border-color:var(--yolk);color:#1B1408}
.sep{width:1px;height:20px;background:var(--ink3);margin:0 3px}
.roll{background:none;border:1px solid var(--yolk);color:var(--yolk);cursor:pointer;padding:6px 16px;
  border-radius:3px;font-family:var(--num);font-size:13px;letter-spacing:.16em;transition:.14s;margin-left:auto}
.roll:hover{background:var(--yolk);color:#1B1408}

.hint{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:rgba(240,180,41,.07);
  border:1px solid rgba(240,180,41,.22);border-radius:4px;padding:11px 15px;margin-top:16px;font-size:14px}
.hint .k{font-family:var(--num);font-size:11px;letter-spacing:.2em;color:var(--yolk)}
.hint button{background:var(--yolk);border:0;color:#1B1408;border-radius:3px;padding:5px 13px;
  font-size:13px;font-family:var(--sans);font-weight:500;cursor:pointer;margin-left:auto}
.hint button:hover{filter:brightness(1.1)}

.band{display:flex;align-items:baseline;gap:10px;margin:30px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--ink3)}
.band h2{font-family:var(--serif);font-weight:700;font-size:19px}
.band .n{font-family:var(--num);font-size:13px;color:var(--dimmer);letter-spacing:.12em}
.band.go h2{color:var(--yolk)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px}
.card{position:relative;background:var(--ink2);border:1px solid var(--ink3);border-radius:4px;
  padding:15px 14px 13px;cursor:pointer;text-align:left;transition:border-color .16s,transform .16s,background .16s}
.card:hover{border-color:var(--ink4);background:#26201B;transform:translateY(-2px)}
.card.dim{opacity:.7}
@media (prefers-reduced-motion:reduce){.card,.card:hover{transition:none;transform:none}}
.arc{--p:50;width:33px;height:33px;border-radius:50%;
  background:conic-gradient(var(--yolk) 0 calc(var(--p)*1%),var(--ink3) 0);
  display:grid;place-items:center;margin-bottom:10px}
.arc span{width:25px;height:25px;border-radius:50%;background:var(--ink2);display:grid;place-items:center;
  font-family:var(--num);font-size:13px;color:var(--paper)}
.card:hover .arc span{background:#26201B}
.card h3{font-family:var(--serif);font-weight:700;font-size:18px;line-height:1.35}
.card .meta{font-size:12px;color:var(--dimmer);margin-top:4px;letter-spacing:.04em}
.card .lack{font-size:12.5px;color:#E4705C;margin-top:8px;line-height:1.5}
.card .tags{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 7px;border-radius:2px;letter-spacing:.05em}
.tag.k{background:rgba(143,176,94,.16);color:var(--scallion)}
.tag.s{background:rgba(200,65,44,.16);color:#E4705C}
.star{position:absolute;top:10px;right:8px;background:none;border:0;cursor:pointer;color:var(--ink4);
  font-size:17px;line-height:1;padding:4px;transition:color .14s}
.star:hover{color:var(--dim)}
.star[aria-pressed=true]{color:var(--yolk)}
.empty{color:var(--dim);padding:30px 0;font-size:14px}
.empty b{color:var(--paper);display:block;font-family:var(--serif);font-size:18px;margin-bottom:6px}

.sheet{position:fixed;inset:0;background:rgba(10,8,6,.72);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.panel{background:var(--ink2);width:100%;max-width:660px;max-height:92vh;overflow-y:auto;
  border-radius:10px 10px 0 0;border:1px solid var(--ink3);border-bottom:0;padding:24px 22px 48px}
@media(min-width:720px){.sheet{align-items:center;padding:24px}
  .panel{border-radius:6px;border-bottom:1px solid var(--ink3);padding:30px 32px 36px}}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.panel h2{font-family:var(--serif);font-weight:900;font-size:26px;line-height:1.3}
.psub{font-size:13px;color:var(--dim);margin-top:6px}
.close{background:none;border:1px solid var(--ink3);color:var(--dim);border-radius:3px;width:34px;height:34px;
  flex:none;cursor:pointer;font-size:17px;line-height:1}
.close:hover{color:var(--paper);border-color:var(--ink4)}
.sec{font-family:var(--num);font-size:11px;letter-spacing:.24em;color:var(--dimmer);
  margin:24px 0 11px;padding-bottom:7px;border-bottom:1px solid var(--ink3)}
.ing{display:flex;justify-content:space-between;gap:16px;padding:5px 0;font-size:14.5px;border-bottom:1px dotted var(--ink3)}
.ing:last-child{border-bottom:0}
.ing.miss{color:#E4705C}
.ing.miss span:first-child::after{content:" 缺";font-size:12px;opacity:.85}
.ing .q{font-family:var(--num);color:var(--yolk);white-space:nowrap;font-size:15px}
.ing.miss .q{color:#E4705C;opacity:.7}
.sauce-box{background:var(--ink);border-left:2px solid var(--yolk);padding:11px 14px;border-radius:0 3px 3px 0}
.sauce-box .ing{border-bottom:0;padding:3px 0}
.step{display:flex;gap:16px;padding:10px 0;border-bottom:1px solid var(--ink3)}
.step:last-child{border-bottom:0}
.step .t{font-family:var(--num);font-size:16px;color:var(--yolk);width:42px;flex:none;padding-top:1px}
.step .t small{font-size:10px;color:var(--dimmer);display:block;letter-spacing:.1em;margin-top:-3px}
.step p{font-size:14.5px;line-height:1.7}
.tip{background:rgba(240,180,41,.07);border:1px solid rgba(240,180,41,.2);border-radius:3px;
  padding:13px 16px;margin-top:22px;font-size:14px;line-height:1.7}
.tip b{font-family:var(--num);font-size:11px;letter-spacing:.2em;color:var(--yolk);display:block;margin-bottom:6px;font-weight:400}
.more{background:none;border:1px dashed var(--ink4);color:var(--dim);border-radius:3px;padding:9px 0;
  width:100%;margin-top:10px;cursor:pointer;font-family:var(--sans);font-size:13.5px;transition:.14s}
.more:hover{border-color:var(--dim);color:var(--paper)}
#nq{background:var(--ink2);border:1px solid var(--ink3);color:var(--paper);border-radius:3px;
  padding:5px 11px;font-family:var(--sans);font-size:13px;width:120px}
#nq::placeholder{color:var(--dimmer)}
.mine{position:absolute;top:11px;left:11px;font-family:var(--num);font-size:10px;letter-spacing:.14em;color:var(--scallion)}
.card.own{border-color:rgba(143,176,94,.35)}
.form label{display:block;font-family:var(--num);font-size:11px;letter-spacing:.2em;color:var(--dimmer);margin:16px 0 6px}
.form input[type=text],.form input[type=number],.form textarea,.form select{
  width:100%;background:var(--ink);border:1px solid var(--ink3);color:var(--paper);border-radius:3px;
  padding:9px 12px;font-family:var(--sans);font-size:14px;line-height:1.7}
.form textarea{resize:vertical;min-height:80px}
.form .two{display:flex;gap:10px}.form .two>div{flex:1}
.hintline{font-size:12px;color:var(--dimmer);margin-top:5px;line-height:1.6}
.actions{display:flex;gap:8px;margin-top:26px;flex-wrap:wrap}
.btn{background:var(--yolk);border:0;color:#1B1408;border-radius:3px;padding:9px 20px;font-size:14px;
  font-family:var(--sans);font-weight:500;cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--ink3);color:var(--dim)}
.btn.ghost:hover{border-color:var(--ink4);color:var(--paper)}
.btn.danger{background:none;border:1px solid rgba(200,65,44,.5);color:#E4705C}
.warn{color:#E4705C;font-size:13px;margin-top:10px}
footer{color:var(--dimmer);font-size:12.5px;line-height:1.8;margin-top:44px;padding-top:20px;border-top:1px solid var(--ink3)}
/* ===== v5：使用者狀態 · 庫存效期 · 熱量 ===== */
html{color-scheme:dark}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
#dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:9px;margin-top:16px}
.tile{background:var(--ink2);border:1px solid var(--ink3);border-radius:4px;padding:12px 14px}
.tile .lb{font-family:var(--num);font-size:10.5px;letter-spacing:.2em;color:var(--dimmer)}
.tile .vl{font-family:var(--num);font-size:24px;color:var(--paper);line-height:1.15;margin-top:6px}
.tile .vl small{font-size:12px;color:var(--dimmer);letter-spacing:.08em;margin-left:4px}
.tile .sub{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.5}
.tile.hot .vl{color:var(--yolk)}
.tile.bad{border-color:rgba(200,65,44,.4)}
.tile.bad .vl{color:#E4705C}
.meter{height:5px;border-radius:3px;background:var(--ink3);margin-top:9px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--scallion);border-radius:3px;transition:width .3s}
.meter i.mid{background:var(--yolk)}
.meter i.over{background:var(--chili)}
.setup{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:rgba(240,180,41,.07);
  border:1px solid rgba(240,180,41,.22);border-radius:4px;padding:13px 16px;margin-top:16px}
.setup b{font-family:var(--serif);font-size:16px;display:block;margin-bottom:3px}
.setup span{font-size:13px;color:var(--dim);line-height:1.6}
.setup button{background:var(--yolk);border:0;color:#1B1408;border-radius:3px;padding:7px 16px;
  font-size:13.5px;font-family:var(--sans);font-weight:500;cursor:pointer;margin-left:auto;white-space:nowrap}

.alertbox{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-radius:4px;padding:11px 15px;margin-top:12px;font-size:14px;
  background:rgba(200,65,44,.08);border:1px solid rgba(200,65,44,.28)}
.alertbox.soon{background:rgba(240,180,41,.07);border-color:rgba(240,180,41,.22)}
.alertbox .k{font-family:var(--num);font-size:11px;letter-spacing:.2em;color:#E4705C}
.alertbox.soon .k{color:var(--yolk)}
.alertbox b{color:var(--paper)}
.alertbox button{background:none;border:1px solid var(--ink4);color:var(--dim);border-radius:3px;
  padding:5px 12px;font-size:13px;font-family:var(--sans);cursor:pointer;margin-left:auto}
.alertbox button:hover{color:var(--paper);border-color:var(--dim)}

.suggbox{margin-top:18px;border:1px solid var(--ink3);border-radius:4px;background:var(--ink2);padding:14px 16px 6px}
.suggbox .st{font-family:var(--num);font-size:11px;letter-spacing:.24em;color:var(--yolk);margin-bottom:4px}
.suggbox .sn0{font-size:12.5px;color:var(--dimmer);margin-bottom:10px;line-height:1.6}
.sug{display:flex;align-items:baseline;gap:12px;padding:9px 0;border-top:1px solid var(--ink3);cursor:pointer;text-align:left;
  background:none;border-left:0;border-right:0;border-bottom:0;width:100%;font-family:var(--sans);color:var(--paper)}
.sug:hover .nm{color:var(--yolk)}
.sug .rk{font-family:var(--num);font-size:12px;color:var(--dimmer);width:16px;flex:none}
.sug .nm{font-family:var(--serif);font-weight:700;font-size:16px;white-space:nowrap}
.sug .wy{font-size:12.5px;color:var(--dim);line-height:1.5}
.sug .kk{font-family:var(--num);font-size:13px;color:var(--dimmer);margin-left:auto;white-space:nowrap}

.it .dd{font-family:var(--num);font-size:10px;margin-left:5px;padding:0 4px;border-radius:2px;font-weight:400;
  background:rgba(240,180,41,.18);color:var(--yolk)}
.it .dd.red{background:rgba(200,65,44,.22);color:#E4705C}
.it[aria-pressed=true] .dd{background:rgba(240,180,41,.3);color:#7A5A05}
.it[aria-pressed=true] .dd.red{background:rgba(200,65,44,.25);color:#8C2216}
.stockbox summary b{color:var(--yolk);letter-spacing:.1em}
summary b{color:var(--yolk);letter-spacing:.1em}
.lnk{background:none;border:0;color:var(--dim);font-family:var(--sans);font-size:12.5px;
  cursor:pointer;padding:0;margin-left:12px;text-decoration:underline;text-underline-offset:3px}
.lnk:hover{color:var(--yolk)}
.srow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dotted var(--ink3);flex-wrap:wrap}
.srow .sn{font-size:14px;min-width:88px}
.srow input{background:var(--ink);border:1px solid var(--ink3);color:var(--paper);border-radius:3px;
  padding:4px 8px;font-family:var(--sans);font-size:13px}
.srow .sq{width:92px}
.srow .se{width:140px;font-family:var(--num)}
.srow .sx{background:none;border:1px solid var(--ink3);color:var(--dimmer);border-radius:3px;
  padding:4px 10px;font-size:12.5px;cursor:pointer;margin-left:auto;font-family:var(--sans)}
.srow .sx:hover{color:#E4705C;border-color:rgba(200,65,44,.5)}
.srow .lft{font-family:var(--num);font-size:12px;color:var(--yolk);min-width:46px}
.srow .lft.red{color:#E4705C}

.card .kc{color:var(--dim)}
.card .use{font-size:12.5px;color:var(--scallion);margin-top:7px;line-height:1.5}
.tag.e{background:rgba(240,180,41,.16);color:var(--yolk)}

.nut{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px}
.nbox{background:var(--ink);border:1px solid var(--ink3);border-radius:3px;padding:10px 12px}
.nbox .lb{font-family:var(--num);font-size:10px;letter-spacing:.18em;color:var(--dimmer)}
.nbox .vv{font-family:var(--num);font-size:19px;margin-top:4px}
.nbox.k .vv{color:var(--yolk)}
.nnote{font-size:12.5px;color:var(--dimmer);margin-top:10px;line-height:1.7}
.fitline{font-size:13.5px;margin-top:10px;padding:9px 12px;border-radius:3px;line-height:1.6;
  background:rgba(143,176,94,.12);border:1px solid rgba(143,176,94,.28);color:#C9DDA6}
.fitline.over{background:rgba(200,65,44,.1);border-color:rgba(200,65,44,.3);color:#E4705C}

.logrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--ink3);font-size:14.5px}
.logrow .lk{font-family:var(--num);color:var(--yolk);margin-left:auto;white-space:nowrap}
.logrow .lx{background:none;border:0;color:var(--ink4);cursor:pointer;font-size:16px;padding:0 2px}
.logrow .lx:hover{color:#E4705C}
.logrow .ls{font-size:12px;color:var(--dimmer)}
.days{display:flex;align-items:flex-end;gap:7px;height:96px;margin-top:6px}
.day{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.day i{width:100%;background:var(--ink4);border-radius:2px 2px 0 0;min-height:2px;display:block}
.day i.on{background:var(--yolk)}
.day i.over{background:var(--chili)}
.day span{font-family:var(--num);font-size:10px;color:var(--dimmer)}
.dline{position:relative;border-top:1px dashed var(--ink4);margin-top:-1px}
.pickrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
#dash .setup{grid-column:1/-1;margin-top:0}
</style>

<body>
<div class="wrap">
<header>
  <div class="eyebrow" id="eyebrow">今晚 · <b>兩大一小</b></div>
  <div class="htitle"><h1>冰箱裡有什麼?</h1><div class="hbtns">
    <button class="tog" id="me">我</button>
    <button class="tog" id="today">今天吃了</button>
    <button class="tog" id="mine">我的食譜</button>

/* ---------- 儲存：Claude 環境用 window.storage，自架站用 localStorage，都不行就存在記憶體 ---------- */
const STORE=(()=>{const mem={};return{
  async get(k){
    try{const r=await window.storage.get(k);if(r&&r.value)return r.value;}catch(e){}
    try{const v=localStorage.getItem(k);if(v!==null)return v;}catch(e){}
    return mem[k]||null;
  },
  async set(k,v){
    mem[k]=v;
    try{await window.storage.set(k,v);}catch(e){}
    try{localStorage.setItem(k,v);}catch(e){}
  }};})();

const ALL=GROUPS.flatMap(g=>g.items);
const CUISINES=[...new Set(R.map(r=>r.c))];
const GEAR=[...new Set(R.map(r=>r.e))];
let HAVE=new Set(["雞蛋","白飯"]),NOSAUCE=new Set(),FAV=new Set();
let STOCK={},PROF=null,LOG=[];
let S={time:20,serv:3,kid:false,fav:false,c:new Set(),e:new Set(),kcap:0,fit:false,exp:false};
let OPEN=true,SHELF=false,REFOCUS=null,Q="",NQ="",MY=[],SHOW=[12,12,12];
const PAGE=12;
const RECIPES=()=>R.concat(MY);

async function load(){
  const v=await STORE.get("kitchen");
  if(v)try{const d=JSON.parse(v);
    if(d.have)HAVE=new Set(d.have);
    if(d.nosauce)NOSAUCE=new Set(d.nosauce);
    if(d.fav)FAV=new Set(d.fav);
    if(d.serv)S.serv=d.serv;
    if(d.stock)STOCK=d.stock;
    if(HAVE.size>2)OPEN=false;
  }catch(e){}
  const m=await STORE.get("myrecipes");
  if(m){try{MY=JSON.parse(m)||[];}catch(e){}}
  const p=await STORE.get("profile");
  if(p){try{PROF=JSON.parse(p);}catch(e){}}
  const g=await STORE.get("eatlog");
  if(g){try{LOG=JSON.parse(g)||[];}catch(e){}}
  LOG=LOG.filter(x=>x&&x.d&&daysAgo(x.d)<=90);
  Object.keys(STOCK).forEach(k=>{if(!HAVE.has(k))delete STOCK[k];});
}
function saveMine(){STORE.set("myrecipes",JSON.stringify(MY));}
function save(){STORE.set("kitchen",JSON.stringify({have:[...HAVE],nosauce:[...NOSAUCE],fav:[...FAV],serv:S.serv,stock:STOCK}));}
function saveProf(){STORE.set("profile",JSON.stringify(PROF));}
function saveLog(){STORE.set("eatlog",JSON.stringify(LOG));}

/* ---------- 份量換算 ---------- */
const FR={0.5:"½",0.25:"¼"};
function fmt(v,u){
  let x=v*(S.serv/3);
  if(u==="g")x=Math.max(25,Math.round(x/25)*25);
  else if(u==="ml")x=Math.max(50,Math.round(x/50)*50);
  else if(u==="顆"&&v<1)x=Math.max(.25,Math.round(x*4)/4);
  else x=Math.max(.5,Math.round(x*2)/2);
  const i=Math.floor(x),f=+(x-i).toFixed(2);
  if(u==="g"||u==="ml"||!FR[f])return String(+x.toFixed(2));
  return (i?i:"")+FR[f];
}
const qtyText=a=>a[1]===null?a[2]:fmt(a[1],a[2])+(a[2]==="g"||a[2]==="ml"?"":" ")+a[2];

const NKEYS=Object.keys(NUT).sort((a,b)=>b.length-a.length);
function look(n){
  if(NUT[n])return NUT[n];
  for(const k of NKEYS)if(n.indexOf(k)>=0)return NUT[k];
  return [40,2,.5,6];
}
function gramsOf(name,qty,unit){
  const q=(qty===null||qty===undefined||isNaN(qty))?1:qty;
  const o=UO[name+"|"+unit];
  const per=o!==undefined?o:(UG[unit]!==undefined?UG[unit]:20);
  return q*per;
}
const NCACHE=new Map();
function nutOf(r){
  if(NCACHE.has(r.id))return NCACHE.get(r.id);
  let k=0,p=0,f=0,c=0;
  (r.ing||[]).concat(r.sauce||[]).forEach(a=>{
    const g=gramsOf(a[0],a[1],a[2]),v=look(a[0]);
    k+=v[0]*g/100;p+=v[1]*g/100;f+=v[2]*g/100;c+=v[3]*g/100;
  });
  const o={kcal:Math.round(k/3),p:Math.round(p/3),f:Math.round(f/3),c:Math.round(c/3)};
  NCACHE.set(r.id,o);return o;
}
const kcalOf=r=>nutOf(r).kcal;

/* ---------- 日期 ---------- */
const pad2=n=>(n<10?"0":"")+n;
function today(){const d=new Date();return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
function dnum(s){const a=String(s).split("-").map(Number);return Date.UTC(a[0],a[1]-1,a[2])/864e5;}
const daysAgo=d=>dnum(today())-dnum(d);
const daysTo=d=>dnum(d)-dnum(today());
function shiftDay(n){const d=new Date();d.setDate(d.getDate()+n);
  return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
const WD=["日","一","二","三","四","五","六"];

/* ---------- 使用者狀態：BMR / TDEE / 每日目標 ---------- */
const ACT=[[1.2,"幾乎不動"],[1.375,"每週動 1-3 天"],[1.55,"每週動 3-5 天"],[1.725,"天天在動"]];
const GOALS=[[-.15,"減重"],[0,"維持"],[.1,"增重"]];
function calc(){
  if(!PROF||!PROF.h||!PROF.w)return null;
  const bmr=Math.round(10*PROF.w+6.25*PROF.h-5*PROF.age+(PROF.sex==="f"?-161:5));
  const tdee=Math.round(bmr*PROF.act);
  const target=Math.round(tdee*(1+PROF.goal));
  const prot=Math.round(PROF.w*(PROF.goal<0?1.6:1.4));
  return{bmr:bmr,tdee:tdee,target:target,prot:prot};
}
function eaten(d){
  const day=d||today();
  return LOG.filter(x=>x.d===day).reduce((o,x)=>({kcal:o.kcal+(x.kcal||0),p:o.p+(x.p||0)}),{kcal:0,p:0});
}
function remain(){const c=calc();return c?c.target-eaten().kcal:null;}
function recentIds(n){const L=n||2;return new Set(LOG.filter(x=>daysAgo(x.d)<L).map(x=>x.id));}

/* ---------- 所剩食材：數量與效期 ---------- */
function expDays(i){const s=STOCK[i];return s&&s.exp?daysTo(s.exp):null;}
function expiring(n){
  const lim=n===undefined?2:n;
  return [...HAVE].filter(i=>{const d=expDays(i);return d!==null&&d<=lim;})
    .sort((a,b)=>expDays(a)-expDays(b));
}
function expText(d){return d<0?"已過期":d===0?"今天":d===1?"明天":d+"天";}
function usesExp(r){
  const E=new Set(expiring()),out=new Set();
  r.need.forEach(x=>(Array.isArray(x)?x:[x]).forEach(i=>{if(E.has(i))out.add(i);}));
  return [...out];
}
function dropItem(i){HAVE.delete(i);delete STOCK[i];}

/* ---------- 今晚建議：能做的菜裡，挑最該現在煮的 ---------- */
function suggest(){
  const rem=remain(),c=calc(),ate=eaten(),rec=recentIds(2);
  const pool=RECIPES().filter(r=>r.t<=S.time&&!lacking(r).length&&(!S.kid||r.kid)
    &&(!S.c.size||S.c.has(r.c))&&(!S.e.size||S.e.has(r.e)));
  return pool.map(r=>{
    const n=nutOf(r),why=[];let sc=(20-r.t)/5;
    const ue=usesExp(r);
    if(ue.length){sc+=45*Math.min(2,ue.length);why.push("用掉快過期的"+ue.slice(0,2).join("、"));}
    if(rem!==null){
      if(n.kcal<=Math.max(150,rem)){sc+=22;why.push("每份 "+n.kcal+" 大卡，今天還吃得下");}
      else sc-=Math.min(45,(n.kcal-rem)/15);
    }
    if(c&&ate.p<c.prot*.6&&n.p>=22){sc+=16;why.push("補蛋白質 "+n.p+" 克");}
    if(FAV.has(r.id)){sc+=6;why.push("你收藏過");}
    if(rec.has(r.id))sc-=35;
    if(!why.length)why.push("材料都有，"+r.e+"就能做");
    return{r:r,sc:sc,why:why,n:n};
  }).sort((a,b)=>b.sc-a.sc).slice(0,3);
}

/* ---------- 比對：need 裡的陣列代表「有其中一樣就算有」 ---------- */
const nameOf=x=>Array.isArray(x)?x.slice(0,2).join("或"):x;
const okNeed=x=>Array.isArray(x)?x.some(i=>HAVE.has(i)):HAVE.has(x);
/* 這道菜需要哪些調味料：食譜自己寫的 sneed，加上從材料表推出來的基本調味 */
const SNCACHE=new Map();
function sauceNeed(r){
  if(SNCACHE.has(r.id))return SNCACHE.get(r.id);
  const s=new Set(r.sneed||[]);
  (r.ing||[]).concat(r.sauce||[]).forEach(a=>{
    const n=a[0];
    if(STAPLE[n]){STAPLE[n].forEach(b=>s.add(b));return;}
    if(ALL.some(i=>n.includes(i))||SAUCES.some(x=>n.includes(x)))return;
    STAPLE_FALL.forEach(f=>{if(f[1].test(n))s.add(f[0]);});
  });
  const out=[...s];SNCACHE.set(r.id,out);return out;
}
function lacking(r){
  return r.need.filter(x=>!okNeed(x)).map(nameOf)
    .concat(sauceNeed(r).filter(x=>NOSAUCE.has(x)));
}
function missingSet(r){
  const s=new Set();
  r.need.forEach(x=>{if(!okNeed(x))(Array.isArray(x)?x:[x]).forEach(i=>s.add(i));});
  const mb=new Set(sauceNeed(r).filter(x=>NOSAUCE.has(x)));
  (r.sneed||[]).forEach(x=>{if(mb.has(x))s.add(x);});
  (r.ing||[]).concat(r.sauce||[]).forEach(a=>{
    if((STAPLE[a[0]]||[]).some(x=>mb.has(x)))s.add(a[0]);
  });
  return s;
}
function pass(r){
  if(NQ&&!r.n.includes(NQ))return false;
  if(r.t>S.time)return false;
  if(S.kid&&!r.kid)return false;
  if(S.fav&&!FAV.has(r.id))return false;
  if(S.c.size&&!S.c.has(r.c))return false;
  if(S.e.size&&!S.e.has(r.e))return false;
  if(S.kcap&&kcalOf(r)>S.kcap)return false;
  if(S.fit){const rm=remain();if(rm!==null&&kcalOf(r)>Math.max(150,rm))return false;}
  if(S.exp&&!usesExp(r).length)return false;
  return true;
}
const USES={};ALL.forEach(i=>USES[i]=R.filter(r=>r.need.some(x=>Array.isArray(x)?x.includes(i):x===i)).length);
function unlock(){
  let best=null;
  for(const it of ALL){
    if(HAVE.has(it))continue;
    let c=0;
    for(const r of RECIPES()){
      if(!pass(r))continue;
      const un=r.need.filter(x=>!okNeed(x));
      if(un.length!==1||sauceNeed(r).some(x=>NOSAUCE.has(x)))continue;
      const g=un[0];
      if(Array.isArray(g)?g.includes(it):g===it)c++;
    }
    if(c&&(!best||c>best.c||(c===best.c&&USES[it]>USES[best.it])))best={it,c};
  }
  return best;
}

}

function parseIng(txt){
  return txt.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
    const p=l.split(/\s+/);
    if(p.length>=3&&!isNaN(parseFloat(p[p.length-2])))
      return [p.slice(0,-2).join(" "),parseFloat(p[p.length-2]),p[p.length-1]];
    if(p.length>=2&&!isNaN(parseFloat(p[p.length-1])))
      return [p.slice(0,-1).join(" "),parseFloat(p[p.length-1]),"份"];
    return [p.slice(0,-1).join(" ")||l,null,p.length>1?p[p.length-1]:"適量"];
  });
}
function parseSt(txt){
  return txt.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
    const m=l.match(/^(\d+)\s+(.*)$/);
    return m?[+m[1],m[2]]:[0,l];
  });
}
function saveForm(){
  const g=id=>document.getElementById(id).value.trim();
  const w=document.getElementById("f_warn");
  const n=g("f_n"), t=+g("f_t"), ing=g("f_ing"), st=g("f_st");
  if(!n){w.innerHTML='<div class="warn">菜名不能空白。</div>';return;}
  if(!ing||!st){w.innerHTML='<div class="warn">材料和做法都要填，不然這道菜在廚房裡沒用。</div>';return;}
  if(!PICK.size){w.innerHTML='<div class="warn">至少點一樣食材，否則冰箱比對不到這道菜。</div>';return;}
  MY.push({id:"my_"+Date.now(),own:1,n,c:g("f_c"),e:g("f_e"),t:Math.min(60,Math.max(1,t||15)),
    kid:+g("f_kid"),spicy:+g("f_spicy"),need:[...PICK],sneed:[],
    ing:parseIng(ing),st:parseSt(st),tip:g("f_tip")||"（還沒寫）"});
  saveMine();closeSheet();draw();
}
function exportMine(){
  const blob=new Blob([JSON.stringify(MY,null,1)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="my-recipes.json";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importMine(){
  const i=document.createElement("input");i.type="file";i.accept=".json,application/json";
  i.onchange=()=>{const f=i.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{try{
      const d=JSON.parse(rd.result);
      if(!Array.isArray(d))throw 0;
      const have=new Set(MY.map(x=>x.id));
      d.forEach(x=>{if(x&&x.n&&x.need&&!have.has(x.id))MY.push({...x,own:1});});
      saveMine();closeSheet();draw();
    }catch(e){
      document.getElementById("f_warn").innerHTML='<div class="warn">這個檔案讀不出來，要匯出時產生的 my-recipes.json。</div>';
    }};
    rd.readAsText(f);};
  i.click();
}
/* ---------- 煮好了：記熱量、扣冰箱 ---------- */
function openCook(id){
  const r=RECIPES().find(x=>x.id===id);if(!r)return;
  const n=nutOf(r);
  let cs=S.serv,es=1;
  const items=[...new Set(r.need.reduce((a,x)=>a.concat(Array.isArray(x)?x:[x]),[]).filter(i=>HAVE.has(i)))];
  const used=new Set();
  const panel=document.getElementById("panel");
  function render(){
    const c=calc(),rm=remain();
    panel.innerHTML=`
      <div class="phead"><div><h2 id="ptitle">煮好了：${r.n}</h2>
        <div class="psub">記一筆到今天，順便把用完的食材從冰箱拿掉。</div></div>
        <button class="close" id="cl" aria-label="關閉">✕</button></div>
      <div class="sec">煮了幾人份</div>
      <div class="pickrow">${[1,2,3,4,5,6].map(v=>
        `<button class="mini" data-cs="${v}" aria-pressed="${cs===v}">${v}</button>`).join("")}</div>
      <div class="sec">你自己吃了幾份</div>
      <div class="pickrow">${[[0.5,"半份"],[1,"1 份"],[1.5,"1.5 份"],[2,"2 份"]].map(v=>
        `<button class="mini" data-es="${v[0]}" aria-pressed="${es===v[0]}">${v[1]}</button>`).join("")}</div>
      <div class="fitline${c&&n.kcal*es>rm?" over":""}">記進去的是 <b>${Math.round(n.kcal*es)}</b> 大卡、蛋白質 ${Math.round(n.p*es)} 克。${
        c?(n.kcal*es>rm?`　今天會超過 ${Math.round(n.kcal*es-rm)} 大卡。`:`　今天還會剩 ${Math.round(rm-n.kcal*es)} 大卡。`):""}</div>
      <div class="sec">哪些食材用完了</div>
      <div class="shelf-note">點起來的會從冰箱拿掉，剩下的留著。沒點就當作還有。</div>
      <div class="items">${items.length?items.map(i=>
        `<button class="it" data-u="${i}" aria-pressed="${used.has(i)}">${i}</button>`).join(""):
        "<em style=\"color:var(--dimmer);font-size:13px\">這道用到的東西冰箱裡都沒勾。</em>"}</div>
      <div class="actions">
        <button class="btn" id="cok">記一筆</button>
        <button class="btn ghost" id="cback">回食譜</button></div>`;
    panel.querySelectorAll("[data-cs]").forEach(b=>b.onclick=()=>{cs=+b.dataset.cs;render();});
    panel.querySelectorAll("[data-es]").forEach(b=>b.onclick=()=>{es=+b.dataset.es;render();});
    panel.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{
      const v=b.dataset.u;used.has(v)?used.delete(v):used.add(v);render();});
    panel.querySelector("#cl").onclick=closeSheet;
    panel.querySelector("#cback").onclick=()=>openDish(r.id);
    panel.querySelector("#cok").onclick=()=>{
      LOG.push({ts:Date.now(),d:today(),id:r.id,n:r.n,serv:es,cook:cs,
        kcal:Math.round(n.kcal*es),p:Math.round(n.p*es),f:Math.round(n.f*es),c:Math.round(n.c*es)});
      saveLog();
      used.forEach(dropItem);
      save();closeSheet();draw();
    };
  }
  render();
  document.getElementById("sheet").hidden=false;
  document.body.style.overflow="hidden";
}

/* ---------- 我：身高體重活動量，算出每天能吃多少 ---------- */

  const panel=document.getElementById("panel");
  const p=PROF||{sex:"m",age:38,h:172,w:68,act:1.375,goal:0};
  const c0=calc();
  panel.innerHTML=`
    <div class="phead"><div><h2 id="ptitle">我</h2>
      <div class="psub">只存在這台裝置。用 Mifflin-St Jeor 公式算基礎代謝，再乘活動量。</div></div>
      <button class="close" id="cl" aria-label="關閉">✕</button></div>
    <div class="form">
      <div class="two">
        <div><label>生理性別</label><select id="p_sex">
          <option value="m"${p.sex==="m"?" selected":""}>男</option>
          <option value="f"${p.sex==="f"?" selected":""}>女</option></select></div>
        <div><label>年齡</label><input type="number" id="p_age" value="${p.age}" min="12" max="99"></div>
      </div>
      <div class="two">
        <div><label>身高 CM</label><input type="number" id="p_h" value="${p.h}" min="120" max="220"></div>
        <div><label>體重 KG</label><input type="number" id="p_w" value="${p.w}" min="30" max="200" step="0.5"></div>
      </div>
      <div class="two">
        <div><label>活動量</label><select id="p_act">${ACT.map(a=>
          `<option value="${a[0]}"${p.act===a[0]?" selected":""}>${a[1]}</option>`).join("")}</select></div>
        <div><label>目標</label><select id="p_goal">${GOALS.map(g=>
          `<option value="${g[0]}"${p.goal===g[0]?" selected":""}>${g[1]}</option>`).join("")}</select></div>
      </div>
      <label>家裡幾個人吃　會直接套到每道菜的份量</label>
      <div class="pickrow">${[2,3,4,5].map(v=>
        `<button type="button" class="mini" data-sv="${v}" aria-pressed="${S.serv===v}">${v}</button>`).join("")}</div>
      ${c0?`<div class="sec">目前算出來</div>
        <div class="nut">
          <div class="nbox"><div class="lb">基礎代謝</div><div class="vv">${c0.bmr}</div></div>
          <div class="nbox"><div class="lb">每日消耗</div><div class="vv">${c0.tdee}</div></div>
          <div class="nbox k"><div class="lb">每日目標</div><div class="vv">${c0.target}</div></div>
          <div class="nbox"><div class="lb">蛋白質</div><div class="vv">${c0.prot} <span style="font-size:12px">g</span></div></div>
        </div>`:""}
      <div id="p_warn"></div>
      <div class="actions">
        <button class="btn" id="p_save">存起來</button>
        ${PROF?`<button class="btn danger" id="p_del">清掉資料</button>`:""}</div>
      <div class="hintline">這只是估算，用來抓一個大概。有特殊疾病、懷孕或在做飲食控制，以醫師或營養師講的為準。</div>
    </div>`;
  panel.querySelectorAll("[data-sv]").forEach(b=>b.onclick=()=>{
    S.serv=+b.dataset.sv;save();
    panel.querySelectorAll("[data-sv]").forEach(x=>x.setAttribute("aria-pressed",+x.dataset.sv===S.serv));});
  panel.querySelector("#cl").onclick=closeSheet;
  const pd=panel.querySelector("#p_del");
  if(pd)pd.onclick=()=>{PROF=null;saveProf();S.fit=false;closeSheet();draw();};
  panel.querySelector("#p_save").onclick=()=>{
    const v=id=>document.getElementById(id).value;
    const age=+v("p_age"),h=+v("p_h"),w=+v("p_w");
    if(!(age>=12&&age<=99)||!(h>=120&&h<=220)||!(w>=30&&w<=200)){
      document.getElementById("p_warn").innerHTML='<div class="warn">年齡 12-99、身高 120-220、體重 30-200，數字填在範圍裡。</div>';return;}
    PROF={sex:v("p_sex"),age:age,h:h,w:w,act:+v("p_act"),goal:+v("p_goal")};
    saveProf();closeSheet();draw();
  };
  document.getElementById("sheet").hidden=false;
  document.body.style.overflow="hidden";
}

/* ---------- 今天吃了：紀錄與最近七天 ---------- */
function openToday(){
  const panel=document.getElementById("panel");
  function render(){
    const c=calc(),a=eaten(),rows=LOG.filter(x=>x.d===today()).sort((x,y)=>y.ts-x.ts);
    const days=[];for(let i=6;i>=0;i--){const d=shiftDay(-i);days.push({d:d,k:eaten(d).kcal});}
    const top=Math.max(c?c.target:0,...days.map(x=>x.k),1);
    panel.innerHTML=`
      <div class="phead"><div><h2 id="ptitle">今天吃了</h2>
        <div class="psub">${today()} 週${WD[new Date().getDay()]}${
          c?` · 目標 ${c.target} 大卡`:" · 還沒設定每日目標"}</div></div>
        <button class="close" id="cl" aria-label="關閉">✕</button></div>
      ${c?`<div class="nut" style="margin-top:18px">
        <div class="nbox k"><div class="lb">已攝取</div><div class="vv">${Math.round(a.kcal)}</div></div>
        <div class="nbox"><div class="lb">還可以吃</div><div class="vv">${Math.round(c.target-a.kcal)}</div></div>
        <div class="nbox"><div class="lb">蛋白質</div><div class="vv">${Math.round(a.p)}/${c.prot}</div></div>
      </div>`:`<div class="fitline" style="margin-top:18px">還沒設定身高體重，只能記錄、算不出還能吃多少。
        <button class="btn ghost" id="togo" style="margin-left:8px;padding:4px 12px">去設定</button></div>`}
      <div class="sec">今天的紀錄</div>
      ${rows.length?rows.map(x=>`<div class="logrow">
        <span>${x.n}</span><span class="ls">${x.serv?x.serv+" 份":""}</span>
        <span class="lk">${x.kcal} 大卡</span>
        <button class="lx" data-del="${x.ts}" aria-label="刪掉">✕</button></div>`).join(""):
        `<div class="shelf-note">還沒記東西。做完一道菜，在食譜裡按「煮好了」就會記進來；外食或早餐用下面手動加。</div>`}
      <div class="sec">手動加一筆　外食、早餐、零食</div>
      <div class="form"><div class="two">
        <div><input type="text" id="m_n" placeholder="例：便當、超商御飯糰"></div>
        <div><input type="number" id="m_k" placeholder="大卡" min="1" max="3000"></div>
      </div>
      <div class="actions" style="margin-top:12px"><button class="btn" id="m_add">加進今天</button></div></div>
      <div class="sec">最近七天</div>
      <div class="days">${days.map(x=>{
        const h=Math.max(2,Math.round(x.k/top*88));
        const cls=c?(x.k>c.target?"over":(x.k?"on":"")):(x.k?"on":"");
        return `<div class="day" title="${x.d} ${Math.round(x.k)} 大卡">
          <i class="${cls}" style="height:${h}px"></i>
          <span>${WD[new Date(x.d+"T00:00:00").getDay()]}</span></div>`;}).join("")}</div>
      <div class="nnote">${c?`柱子變紅的那天就是吃超過 ${c.target} 大卡。`:""}紀錄留 90 天，只存在這台裝置。</div>
      <div class="actions">${rows.length?`<button class="btn ghost" id="clr">清掉今天</button>`:""}</div>`;
    panel.querySelector("#cl").onclick=closeSheet;
    const tg=panel.querySelector("#togo");if(tg)tg.onclick=openProfile;
    panel.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
      LOG=LOG.filter(x=>String(x.ts)!==b.dataset.del);saveLog();render();draw();});
    const cl=panel.querySelector("#clr");
    if(cl)cl.onclick=()=>{LOG=LOG.filter(x=>x.d!==today());saveLog();render();draw();};
    panel.querySelector("#m_add").onclick=()=>{
      const n=document.getElementById("m_n").value.trim(),k=+document.getElementById("m_k").value;
      if(!n||!(k>0))return;
      LOG.push({ts:Date.now(),d:today(),id:"manual",n:n,serv:0,kcal:Math.round(k),p:0,f:0,c:0});
      saveLog();render();draw();};
  }
  render();
  document.getElementById("sheet").hidden=false;
  document.body.style.overflow="hidden";
}
document.getElementById("me").onclick=openProfile;
document.getElementById("today").onclick=openToday;

document.getElementById("mine").onclick=openEditor;

load().then(draw);
</script>
