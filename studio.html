<!DOCTYPE html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>電學小知識 · Imagine 分鏡</title>
<meta name="theme-color" content="#191512">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#191512; --ink2:#221D19; --ink3:#2F2822;
  --paper:#F1E9DC; --dim:#A29585; --dimmer:#6E6357;
  --yolk:#F0B429; --serif:'Noto Serif TC','PingFang TC',serif;
  --sans:'Noto Sans TC','PingFang TC',sans-serif; --num:'Oswald','Noto Sans TC',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:15px;line-height:1.65;padding:0 0 72px}
.wrap{max-width:860px;margin:0 auto;padding:0 18px}
header{padding:30px 0 8px}
.eyebrow{font-family:var(--num);font-size:12px;letter-spacing:.22em;color:var(--dimmer);text-transform:uppercase;margin-bottom:12px}
h1{font-family:var(--serif);font-weight:900;font-size:29px;line-height:1.25}
.lead{color:var(--dim);margin-top:12px;max-width:40em}
label{display:block;font-family:var(--num);font-size:11px;letter-spacing:.18em;color:var(--dimmer);margin:22px 0 8px}
select,textarea,input{width:100%;background:var(--ink2);border:1px solid var(--ink3);color:var(--paper);
  border-radius:3px;padding:10px 12px;font-family:var(--sans);font-size:14px}
textarea{min-height:110px;resize:vertical}
.cmd{margin-top:14px;background:var(--ink2);border:1px solid var(--ink3);border-radius:4px;padding:12px 14px;
  font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--yolk);white-space:pre-wrap}
.note{font-size:13px;color:var(--dimmer);margin-top:10px}
.shot{border-top:1px solid var(--ink3);padding:14px 0}
.shot b{font-family:var(--serif)}
.shot .meta{font-size:12.5px;color:var(--dimmer);margin-top:4px}
.shot p{margin-top:6px;color:var(--dim)}
.warn{margin-top:18px;padding:12px 14px;border:1px solid rgba(240,180,41,.35);border-radius:4px;color:#E8D7A4;font-size:13.5px}
</style>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Grok Imagine · 電學小知識</div>
    <h1>分鏡工作室</h1>
    <p class="lead">這不是食譜工具。每一則短片先鎖「這個電學概念、這張圖」，再用 Imagine 生成。不要搜閃電、電塔、電工。</p>
  </header>
  <div class="warn">出片要本機 <code>XAI_API_KEY</code>。沒金鑰也可以先看分鏡。</div>

  <label for="lesson">內建課</label>
  <select id="lesson"></select>

  <label for="topic">或自訂題目</label>
  <input id="topic" placeholder="例如：短路為什麼會跳閘">

  <label for="steps">節拍（一行一個，會蓋過內建步驟）</label>
  <textarea id="steps" placeholder="什麼是短路&#10;電流為什麼暴衝&#10;斷路器怎麼斷開"></textarea>

  <div class="cmd" id="cmd"></div>
  <p class="note">輸出 <code>out/tutorial_video/&lt;id&gt;/tutorial.mp4</code>。內建課在 <code>tools/tutorial_video/data/lessons.json</code>。</p>
  <div id="shots"></div>
</div>
<script>
async function loadLessons(){
  const res=await fetch("tools/tutorial_video/data/lessons.json");
  if(!res.ok) throw new Error("lessons missing");
  return res.json();
}
function draw(lessons){
  const sel=document.getElementById("lesson");
  const topic=document.getElementById("topic").value.trim();
  const custom=document.getElementById("steps").value.split("\n").map(s=>s.trim()).filter(Boolean);
  const lesson=lessons.find(l=>l.id===sel.value)||lessons[0];
  const title=topic||lesson.title;
  const beats=custom.length?custom.map(t=>({text:t,visual:t})):[
    {text:lesson.hook,visual:title},
    ...lesson.steps
  ];
  const cmd=topic||custom.length
    ? `python3 -m tools.tutorial_video plan --topic "${title}" --steps "${(custom.length?custom:lesson.steps.map(s=>s.text)).join("|")}"\npython3 -m tools.tutorial_video render --topic "${title}" --steps "${(custom.length?custom:lesson.steps.map(s=>s.text)).join("|")}"`
    : `python3 -m tools.tutorial_video plan --lesson ${lesson.id}\npython3 -m tools.tutorial_video render --lesson ${lesson.id}`;
  document.getElementById("cmd").textContent=cmd;
  document.getElementById("shots").innerHTML=beats.map((b,i)=>`
    <div class="shot">
      <b>s${String(i).padStart(2,"0")}</b>
      <div class="meta">must include：${title} · 禁止：閃電／電塔／電工 · source：Imagine</div>
      <p>${b.text}${b.visual&&b.visual!==b.text?`<br><span class="meta">${b.visual}</span>`:""}</p>
    </div>`).join("");
}
loadLessons().then(lessons=>{
  const sel=document.getElementById("lesson");
  sel.innerHTML=lessons.map(l=>`<option value="${l.id}">${l.series} · ${l.title}</option>`).join("");
  ["lesson","topic","steps"].forEach(id=>document.getElementById(id).addEventListener("input",()=>draw(lessons)));
  sel.addEventListener("change",()=>draw(lessons));
  draw(lessons);
}).catch(()=>{
  document.getElementById("cmd").textContent="讀不到 lessons.json，用：python3 -m tools.tutorial_video plan --lesson ohms-law";
});
</script>
</body>
</html>
